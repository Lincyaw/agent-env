# agent-env component catalog

components:
  - name: gateway
    type: gateway
    paths:
      - cmd/gateway/main.go
      - pkg/gateway/
    responsibilities:
      - Expose session, execute, file, replay, pool, and managed-session REST APIs
      - Create SandboxTemplate, SandboxWarmPool, and SandboxClaim resources
      - Resolve ready SandboxClaims to executor-agent endpoints
      - Execute evaluator/control-plane commands in gateway-managed private containers
      - Persist sessions in memory or Redis
      - Write trajectory/audit records to ClickHouse
      - Expose Prometheus metrics on the internal HTTP port
    interfaces:
      exposes:
        - Public REST API on gateway.port
        - Internal /metrics and debug endpoints on gateway.internalPort
      calls:
        - Kubernetes API for agent-sandbox CRDs
        - Kubernetes pods/exec subresource for private container execution
        - executor-agent framed protobuf protocol over TCP
        - Kubernetes pods/log subresource for session and pool log streaming
        - Redis
        - ClickHouse

  - name: agent-sandbox
    type: external-controller
    # Upstream repo, consumed as an OCI Helm dependency pinned in
    # charts/agent-env/Chart.yaml. Not vendored into this tree.
    external: true
    paths:
      - ../agent-sandbox
    responsibilities:
      - Reconcile SandboxTemplate, SandboxWarmPool, SandboxClaim, and Sandbox resources
      - Maintain warm sandbox pools
      - Adopt ready sandboxes for claims
      - Manage underlying Kubernetes Pod, Service, and PVC resources
    interfaces:
      watches:
        - SandboxTemplate
        - SandboxWarmPool
        - SandboxClaim
        - Sandbox
      manages:
        - Pod
        - Service
        - PVC

  - name: executor-agent
    type: agent
    paths:
      - rust/executor-agent/
      - Dockerfile.executor-agent-rs
    responsibilities:
      - Run inside the executor container (Rust binary)
      - Serve the V2 protobuf protocol over a Unix socket, a TCP port, and an iroh QUIC endpoint
      - Require per-sandbox token authentication on remote transports (TCP, QUIC); the Unix socket is exempt
      - Execute commands requested by the gateway and stream stdout, stderr, and exit status back
      - Capture per-step workspace diffs and checkpoint tars
    interfaces:
      exposes:
        - Framed protobuf protocol on the executor TCP port
        - Unix socket at /var/run/arl/exec.sock
        - iroh QUIC endpoint

  - name: executor-proto
    type: proto
    paths:
      - proto/executor_v2.proto
      - pkg/pb/
      - sdk/python/arl/arl/pb/
    responsibilities:
      - Single source of truth for the executor framed protobuf contract
      - Generate Go bindings via `make proto-executor`
      - Generate Python bindings and .pyi type stubs via `make proto-python`
      - Rust bindings are generated by rust/executor-agent/build.rs from the same file

  - name: python-sdk
    type: sdk
    paths:
      - sdk/python/arl/
    responsibilities:
      - Provide Python clients for gateway APIs
      - Provide SandboxSession and ManagedSession user workflows
      - Upload/download files, execute commands, restore, replay, and export trajectories
      - Declare private containers and run private-container commands through the gateway

  - name: helm-chart
    type: deployment
    paths:
      - charts/agent-env/
    responsibilities:
      - Deploy gateway
      - Configure Redis, ClickHouse, Prometheus, Grafana, Alertmanager, and proxy options
      - Grant gateway RBAC for agent-sandbox CRDs

  - name: observability
    type: support
    paths:
      - pkg/metrics/
      - pkg/audit/
      - charts/agent-env/templates/prometheus.yaml
      - charts/agent-env/templates/grafana.yaml
    responsibilities:
      - Prometheus metrics collection
      - ClickHouse audit and trajectory storage
      - Grafana dashboard provisioning

  - name: redis
    type: support
    paths:
      - pkg/gateway/redis_store.go
      - charts/agent-env/templates/redis.yaml
    responsibilities:
      - Optional gateway session-state persistence

  - name: clickhouse
    type: support
    paths:
      - pkg/audit/
      - charts/agent-env/templates/clickhouse.yaml
    responsibilities:
      - Optional trajectory and audit storage
