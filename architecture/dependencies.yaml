# agent-env dependency graph

dependencies:
  - from: gateway
    to: agent-sandbox
    type: kubernetes-api
    description: Creates and reads SandboxTemplate, SandboxWarmPool, SandboxClaim, and Sandbox resources.

  - from: gateway
    to: agent-sandbox
    type: kubernetes-api
    description: Uses pods/exec to run evaluator/control-plane commands in configured private containers.

  - from: gateway
    to: executor-agent
    type: tcp
    description: >-
      Executes commands and file operations over the executor V2 framed protobuf
      protocol, authenticating each connection with a per-sandbox token derived
      from the gateway-only master secret (pkg/executorauth).

  - from: gateway
    to: agent-sandbox
    type: kubernetes-api
    description: Reads pods/log to stream session and warm-pool executor container logs.

  - from: gateway
    to: redis
    type: tcp
    description: Persists session state when Redis is enabled.

  - from: gateway
    to: clickhouse
    type: tcp
    description: Writes trajectory and audit events when ClickHouse is enabled.

  - from: executor-agent
    to: executor-proto
    type: implements
    description: Implements the executor V2 framed protobuf contract.

  - from: gateway
    to: executor-proto
    type: implements
    description: Speaks the executor V2 framed protobuf contract from pkg/client.

  - from: python-sdk
    to: gateway
    type: http
    description: Calls the gateway REST API.

  - from: helm-chart
    to: gateway
    type: deploys
    description: Deploys gateway and grants RBAC for agent-sandbox CRDs.

  - from: helm-chart
    to: observability
    type: deploys
    description: Optionally deploys Redis, ClickHouse, Prometheus, Grafana, Alertmanager, and proxy components.
