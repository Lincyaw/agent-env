[tool.uv.workspace]
members = ["sdk/python/arl"]

[project]
name = "agent-env"
version = "0.1.0"
description = "ARL Infrastructure - Kubernetes operator and Python SDK"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "ARL Infrastructure Team"}
]

dependencies = [
    "kubernetes>=34.1.0",
    "pydantic>=2.12.5",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "urllib3>=2.3.0",
    "arl-env",
    "websockets>=12.0",
    "typer>=0.16.0",
]

[dependency-groups]
prefetch = [
    "polars>=1.38.1",
    "pyarrow>=23.0.0",
    "hf-transfer>=0.1.9",
    "huggingface-hub>=1.4.1",
    "datasets>=4.6.0",
]
dev = [
    "bandit>=1.9.2",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".github/skills/**",
    "hack/**",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Example scripts spell wire-protocol constants (ALPN, MSG_REQUEST, ...) in
# caps inside the test function that uses them; that reads better than the
# lowercase pep8-naming wants for locals.
"examples/python/*.py" = ["N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = [
    ".github/skills/",
    "hack/",
    # protoc output: the runtime builder injects the message classes, so the
    # .py reads as undefined names to a static checker. The generated
    # executor_v2_pb2.pyi beside it is what mypy type-checks callers against.
    "sdk/python/arl/arl/pb/.*_pb2\\.py$",
]

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.protobuf.*"]
ignore_missing_imports = true

# Optional extra: `pip install arl-env[harbor]`. Absent in the default env.
[[tool.mypy.overrides]]
module = ["harbor", "harbor.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["iroh", "iroh.*"]
ignore_missing_imports = true

[tool.uv.sources]
arl-env = { editable = true, workspace = true }
